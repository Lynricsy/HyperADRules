name: Build and release HyperADRules rulesets

on:
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * *"

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout converter
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Fetch upstream rules
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/liuzq2002/Adguard-Home-For-Magisk-Mod upstream-adguard
          git clone --depth=1 https://github.com/privacy-protection-tools/anti-AD upstream-anti-ad
          curl -fsSL https://raw.githubusercontent.com/privacy-protection-tools/dead-horse/master/anti-ad-white-for-clash.yaml -o upstream-anti-ad/anti-ad-white-for-clash.yaml
          curl -fsSL https://raw.githubusercontent.com/lingeringsound/10007/main/reward -o upstream-coolapk-1007-reward.txt

          ADGUARD_SHA="$(git -C upstream-adguard rev-parse HEAD)"
          ANTI_AD_SHA="$(git -C upstream-anti-ad rev-parse HEAD)"
          DEAD_HORSE_SHA="$(sha256sum upstream-anti-ad/anti-ad-white-for-clash.yaml | cut -d ' ' -f 1)"
          COOLAPK_1007_REWARD_SHA="$(sha256sum upstream-coolapk-1007-reward.txt | cut -d ' ' -f 1)"
          CONVERTER_SHA="${GITHUB_SHA}"
          RELEASE_DATE="$(date -u +%Y%m%d)"

          {
            echo "ADGUARD_SHA=${ADGUARD_SHA}"
            echo "ANTI_AD_SHA=${ANTI_AD_SHA}"
            echo "DEAD_HORSE_SHA=${DEAD_HORSE_SHA}"
            echo "COOLAPK_1007_REWARD_SHA=${COOLAPK_1007_REWARD_SHA}"
            echo "CONVERTER_SHA=${CONVERTER_SHA}"
            echo "RELEASE_DATE=${RELEASE_DATE}"
          } >> "$GITHUB_ENV"

          echo "converter: ${CONVERTER_SHA}"
          echo "adguard: ${ADGUARD_SHA}"
          echo "anti-ad: ${ANTI_AD_SHA}"

      - name: Build text rule providers
        run: |
          uv run python -m scripts.build_rulesets \
            --adguard-source upstream-adguard \
            --anti-ad-source upstream-anti-ad \
            --coolapk-1007-reward-source upstream-coolapk-1007-reward.txt \
            --local-allow-source sources/local_allow.txt \
            --output dist \
            --adguard-commit "$ADGUARD_SHA" \
            --anti-ad-commit "$ANTI_AD_SHA" \
            --dead-horse-commit "$DEAD_HORSE_SHA" \
            --coolapk-1007-reward-commit "$COOLAPK_1007_REWARD_SHA"

      - name: Install latest mihomo
        run: |
          python3 - <<'PY' > /tmp/mihomo_url
          from __future__ import annotations

          import json
          import urllib.request

          with urllib.request.urlopen("https://api.github.com/repos/MetaCubeX/mihomo/releases/latest", timeout=30) as response:
              release = json.load(response)
          for asset in release["assets"]:
              name = asset["name"]
              if name.startswith("mihomo-linux-amd64-") and name.endswith(".gz") and "-go" not in name:
                  print(asset["browser_download_url"])
                  raise SystemExit(0)
          raise SystemExit("missing linux amd64 mihomo asset")
          PY
          curl -fsSL "$(cat /tmp/mihomo_url)" -o /tmp/mihomo.gz
          gzip -d /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          /tmp/mihomo -v

      - name: Install latest sing-box
        run: |
          python3 - <<'PY' > /tmp/singbox_url
          from __future__ import annotations

          import json
          import urllib.request

          with urllib.request.urlopen("https://api.github.com/repos/SagerNet/sing-box/releases/latest", timeout=30) as response:
              release = json.load(response)
          for asset in release["assets"]:
              name = asset["name"]
              if name.startswith("sing-box-") and name.endswith("-linux-amd64.tar.gz") and "musl" not in name and "glibc" not in name:
                  print(asset["browser_download_url"])
                  raise SystemExit(0)
          raise SystemExit("missing linux amd64 sing-box asset")
          PY
          curl -fsSL "$(cat /tmp/singbox_url)" -o /tmp/sing-box.tgz
          mkdir -p /tmp/sing-box-extract
          tar -xzf /tmp/sing-box.tgz -C /tmp/sing-box-extract
          install -m 755 "$(find /tmp/sing-box-extract -type f -name sing-box | head -n 1)" /tmp/sing-box
          /tmp/sing-box version

      - name: Convert to MRS and SRS
        run: |
          set -euo pipefail
          for file in dist/hyper_adrules_ads.txt dist/hyper_adrules_allow.txt dist/hyper_adrules_malware.txt; do
            /tmp/mihomo convert-ruleset domain text "$file" "${file%.txt}.mrs"
          done
          for file in dist/hyper_adrules_ads_ipcidr.txt dist/hyper_adrules_allow_ipcidr.txt dist/hyper_adrules_malware_ipcidr.txt; do
            # mihomo ipcidr MRS 不支持 0 条 (加载报 length is invalid); 空集由脚本换成 discard-only 占位地址再编译。
            src="$(mktemp)"
            uv run python -m scripts.prepare_ipcidr_mrs_source --text "$file" --source "$src"
            /tmp/mihomo convert-ruleset ipcidr text "$src" "${file%.txt}.mrs"
            rm -f "$src"
          done
          for file in dist/hyper_adrules_ads_singbox.json dist/hyper_adrules_allow_singbox.json dist/hyper_adrules_malware_singbox.json; do
            /tmp/sing-box rule-set compile --output "${file%.json}.srs" "$file"
          done
          # 用本次下载的 mihomo 实际启动并初始化全部 MRS provider (-t 不加载 provider, 无法发现格式错误)。
          uv run python -m scripts.validate_mrs_bundle --dist dist --mihomo /tmp/mihomo
          uv run python -m scripts.ruleset_stats --output dist
          # ipcidr 空集已是非 0 字节占位; 仍清理其他格式可能产生的 0 字节文件, 避免 Release 拒收。
          find dist -maxdepth 1 -type f -size 0 -delete
          find dist -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          sha256sum -c dist/SHA256SUMS

          # 日期 tag 便于阅读; content id 只写在 notes 供追溯。
          # 同日重跑: 完整且 checksum 一致则跳过, 否则删残缺/旧产物后重建。
          CONTENT_ID="$(sha256sum dist/SHA256SUMS | cut -c1-16)"
          RELEASE_TAG="snapshot-${RELEASE_DATE}"
          {
            echo "CONTENT_ID=${CONTENT_ID}"
            echo "RELEASE_TAG=${RELEASE_TAG}"
          } >> "$GITHUB_ENV"
          echo "release tag candidate: ${RELEASE_TAG} (content ${CONTENT_ID})"

      - name: Decide whether snapshot is already complete
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish=true
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "found existing release: $RELEASE_TAG"
            rm -rf /tmp/existing-release
            mkdir -p /tmp/existing-release
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D /tmp/existing-release; then
              set +e
              uv run python -m scripts.check_release_completeness \
                --repo "$GITHUB_REPOSITORY" \
                --tag "$RELEASE_TAG" \
                --local-checksum dist/SHA256SUMS \
                --remote-checksum /tmp/existing-release/SHA256SUMS
              completeness_status=$?
              set -e
              if [ "$completeness_status" -eq 0 ]; then
                publish=false
              elif [ "$completeness_status" -eq 2 ]; then
                gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              else
                exit "$completeness_status"
              fi
            else
              echo "existing release missing SHA256SUMS; delete and rebuild"
              gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          else
            echo "new snapshot: $RELEASE_TAG"
          fi

          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        if: steps.snapshot.outputs.publish == 'true'
        run: |
          {
            echo "# HyperADRules multi-format rulesets"
            echo
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Content id: \`$CONTENT_ID\` (sha256 of dist/SHA256SUMS, first 16 hex)"
            echo "- Converter commit: \`$CONVERTER_SHA\`"
            echo "- Upstream: https://github.com/liuzq2002/Adguard-Home-For-Magisk-Mod"
            echo "- Upstream commit: \`$ADGUARD_SHA\`"
            echo "- Upstream: https://github.com/privacy-protection-tools/anti-AD"
            echo "- Upstream commit: \`$ANTI_AD_SHA\`"
            echo "- Upstream: https://raw.githubusercontent.com/privacy-protection-tools/dead-horse/master/anti-ad-white-for-clash.yaml"
            echo "- Upstream SHA256: \`$DEAD_HORSE_SHA\`"
            echo "- Upstream: https://raw.githubusercontent.com/lingeringsound/10007/main/reward"
            echo "- Upstream SHA256: \`$COOLAPK_1007_REWARD_SHA\`"
            echo "- Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            cat dist/manifest.md
          } > release-notes.md

      - name: Publish release
        if: steps.snapshot.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: HyperADRules rulesets ${{ env.RELEASE_DATE }}
          body_path: release-notes.md
          files: |
            dist/*.mrs
            dist/*.srs
            dist/*.txt
            dist/*.yaml
            dist/*.json
            dist/*.conf
            dist/manifest.md
            dist/SHA256SUMS
          make_latest: true
          # 同 content fingerprint 已完整则跳过; 残缺 release 会先删除再建, 不覆盖 assets。
          overwrite_files: false
